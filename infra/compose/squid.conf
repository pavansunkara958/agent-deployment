# Hostname allow-list, mirroring the Network Firewall rule group in Terraform.
# One list, two enforcement points — and if they ever disagree, the local
# simulation stops matching production and silently stops being useful.

http_port 3128

acl allowed_hosts dstdomain .groq.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow allowed_hosts
http_access deny all

# Log every denial. During an incident "what did it try to reach" is the first
# question, and an unlogged denial cannot answer it.
access_log stdio:/dev/stdout
